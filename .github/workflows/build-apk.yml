name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'Emporio_POS_CATEGORIAS_CORREGIDAS_v3_2.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB2APK_REPO: bhawan-kavinda/Web2APK

jobs:
  build:
    name: Build Emporio APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Emporio source
        run: |
          test -f Emporio_POS_CATEGORIAS_CORREGIDAS_v3_2.zip
          unzip -o Emporio_POS_CATEGORIAS_CORREGIDAS_v3_2.zip -d "$GITHUB_WORKSPACE"
          test -f index.html
          test -f assets/icon-192.png
          test -f .github/icon.png

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get Web2APK release
        run: |
          REPO_URL="https://github.com/$WEB2APK_REPO.git"
          REF=$(git ls-remote --tags --refs --sort=-v:refname "$REPO_URL" 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          test -n "$REF"
          git clone --depth 1 --branch "$REF" "$REPO_URL" "$RUNNER_TEMP/Web2APK"
          echo "W2A_DIR=$RUNNER_TEMP/Web2APK" >> "$GITHUB_ENV"

      - name: Build Emporio APK
        env:
          WEB_DIR: ${{ github.workspace }}
          CONFIG_DIR: ${{ github.workspace }}/.github
          OUT_DIR: ${{ github.workspace }}/output
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: node "$W2A_DIR/scripts/build.mjs"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Emporio-Night-Club-POS-cierre-0600
          path: output/*.apk
          if-no-files-found: error
          
